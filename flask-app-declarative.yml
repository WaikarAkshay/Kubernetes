apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app
  namespace: flask-app-ns
spec:
  project: default
  source:
    repoURL: https://github.com/WaikarAkshay/Kubernetes.git    # Replace it with your forked repo
    targetRevision: master
    path: flask-app-pod
  destination:
    server: https://172.31.35.97:33893   # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
